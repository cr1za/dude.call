plugins { id 'com.android.application' }

android {
    namespace 'com.cr1za.dudecall'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cr1za.dudecall'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.3.0'
    }

    signingConfigs {
        reproducibleDebug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.reproducibleDebug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
